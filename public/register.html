<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBill POS — Register Your Business</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .register-page { min-height: 100vh; background: radial-gradient(ellipse at 60% 30%, #1a2a1a 0%, #0f172a 70%); display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; }
        .register-container { width: 100%; max-width: 560px; }
        .brand-logo { font-size: 22px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; }
        .brand-logo i { font-size: 26px; }
        .register-card { background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border); padding: 36px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); margin-top: 24px; }
        .register-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .register-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
        .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 600; margin: 24px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .input-icon-wrap { position: relative; }
        .input-icon-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-icon-wrap input, .input-icon-wrap select { padding-left: 40px; }
        .toggle-pass { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; }
        .error-msg { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
        .trial-badge { background: rgba(0,168,107,0.1); border: 1px solid rgba(0,168,107,0.25); border-radius: 10px; padding: 14px 16px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
        .trial-badge i { font-size: 22px; color: var(--accent); }
        .trial-badge h4 { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
        .trial-badge p { font-size: 12px; color: var(--text-muted); margin: 0; }
        .packages-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .pkg-card { border: 2px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; transition: all 0.2s; text-align: center; position: relative; }
        .pkg-card:hover { border-color: var(--accent); }
        .pkg-card.selected { border-color: var(--accent); background: rgba(0,168,107,0.08); }
        .pkg-card.popular::before { content: 'POPULAR'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; font-size: 10px; font-weight: 700; padding: 2px 10px; border-radius: 20px; }
        .pkg-card .pkg-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .pkg-card .pkg-price { font-size: 18px; font-weight: 800; color: var(--accent); }
        .pkg-card .pkg-duration { font-size: 12px; color: var(--text-muted); }
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
        .login-link a { color: var(--accent); font-weight: 600; text-decoration: none; }
        .strength-bar { height: 3px; border-radius: 2px; margin-top: 6px; transition: all 0.3s; background: var(--border); }
        .strength-bar.weak { background: #ef4444; width: 30%; }
        .strength-bar.medium { background: #f59e0b; width: 65%; }
        .strength-bar.strong { background: var(--accent); width: 100%; }
        @media (max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } .register-card { padding: 24px 18px; } }
    </style>
</head>
<body class="login-container" style="display:block; min-height:100vh; background: radial-gradient(ellipse at 60% 30%, #1a2a1a 0%, #0f172a 70%); padding: 40px 20px;">
    <div style="max-width:560px; margin: 0 auto;">
        <div class="brand-logo"><i class="fas fa-bolt"></i> QuickBill POS</div>
        <p style="text-align:center; color:var(--text-muted); font-size:13px; margin-bottom:28px;">Register your business and start your free trial</p>

        <div class="register-card fade-in">
            <h2>Create Business Account</h2>
            <p>Get started in under 2 minutes. No credit card required.</p>

            <div class="trial-badge">
                <i class="fas fa-gift"></i>
                <div>
                    <h4>7-Day Free Trial Included</h4>
                    <p>Full access to all features. Upgrade anytime.</p>
                </div>
            </div>

            <div id="errorMessage" class="error-msg"></div>

            <form id="registerForm" novalidate>
                <div class="section-title">Business Information</div>
                <div class="form-group">
                    <label>Business Name <span style="color:#ef4444">*</span></label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-store"></i>
                        <input type="text" id="businessName" placeholder="e.g. Wasana Supermarket" required>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Owner Name <span style="color:#ef4444">*</span></label>
                        <div class="input-icon-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" id="ownerName" placeholder="Your full name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Phone <span style="color:#ef4444">*</span></label>
                        <div class="input-icon-wrap">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="phone" placeholder="077 123 4567" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Business Address</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" id="address" placeholder="No. 1, Main Street, Colombo">
                    </div>
                </div>
                <div class="form-group">
                    <label>Currency</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-coins"></i>
                        <select id="currency">
                            <option value="Rs.">LKR — Rs. (Sri Lankan Rupee)</option>
                            <option value="USD">USD — $ (US Dollar)</option>
                            <option value="EUR">EUR — € (Euro)</option>
                            <option value="GBP">GBP — £ (British Pound)</option>
                            <option value="INR">INR — ₹ (Indian Rupee)</option>
                        </select>
                    </div>
                </div>

                <div class="section-title">Login Credentials</div>
                <div class="form-group">
                    <label>Email Address <span style="color:#ef4444">*</span></label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="your@email.com" required>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Password <span style="color:#ef4444">*</span></label>
                        <div class="input-icon-wrap" style="position:relative;">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="Min. 8 characters" required style="padding-right:44px;">
                            <button type="button" class="toggle-pass" onclick="togglePass('password', this)"><i class="fas fa-eye"></i></button>
                        </div>
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password <span style="color:#ef4444">*</span></label>
                        <div class="input-icon-wrap" style="position:relative;">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmPassword" placeholder="Repeat password" required style="padding-right:44px;">
                            <button type="button" class="toggle-pass" onclick="togglePass('confirmPassword', this)"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:14px; font-size:15px; font-weight:700; margin-top:8px;" id="registerBtn">
                    <i class="fas fa-rocket"></i> CREATE ACCOUNT &amp; START FREE TRIAL
                </button>
            </form>

            <div class="login-link">
                Already have an account? <a href="/login.html">Log in →</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        if (localStorage.getItem('qb_token')) window.location.href = '/index.html';

        function togglePass(id, btn) {
            const inp = document.getElementById(id);
            const isPass = inp.type === 'password';
            inp.type = isPass ? 'text' : 'password';
            btn.querySelector('i').className = `fas fa-eye${isPass ? '-slash' : ''}`;
        }

        document.getElementById('password').addEventListener('input', function() {
            const bar = document.getElementById('strengthBar');
            const v = this.value;
            bar.className = 'strength-bar';
            if (!v) return;
            const score = (v.length >= 8 ? 1 : 0) + (/[A-Z]/.test(v) ? 1 : 0) + (/[0-9]/.test(v) ? 1 : 0) + (/[^A-Za-z0-9]/.test(v) ? 1 : 0);
            bar.classList.add(score <= 1 ? 'weak' : score <= 2 ? 'medium' : 'strong');
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('errorMessage');
            err.style.display = 'none';

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (password !== confirm) {
                err.textContent = 'Passwords do not match.';
                err.style.display = 'block';
                return;
            }
            if (password.length < 8) {
                err.textContent = 'Password must be at least 8 characters.';
                err.style.display = 'block';
                return;
            }

            const btn = document.getElementById('registerBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
            btn.disabled = true;

            try {
                const res = await axios.post('/api/auth/register', {
                    businessName: document.getElementById('businessName').value.trim(),
                    ownerName: document.getElementById('ownerName').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    address: document.getElementById('address').value.trim(),
                    currency: document.getElementById('currency').value,
                    password,
                    confirmPassword: confirm
                });

                if (res.data.success) {
                    localStorage.setItem('qb_token', res.data.token);
                    localStorage.setItem('qb_business', JSON.stringify(res.data.business));
                    localStorage.setItem('qb_subscription', JSON.stringify(res.data.subscription));
                    window.location.href = '/index.html';
                }
            } catch (error) {
                const msg = error.response?.data?.message || 'Registration failed. Please try again.';
                err.textContent = msg;
                err.style.display = 'block';
                btn.innerHTML = '<i class="fas fa-rocket"></i> CREATE ACCOUNT & START FREE TRIAL';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
